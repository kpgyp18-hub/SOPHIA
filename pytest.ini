[pytest]
# The repository-level cache is not writable in this environment.  Keep all
# disposable test metadata under the already writable workspace boundary.
cache_dir = workspace/.pytest_cache_local
# pytest's default tmp_path/tmp_path_factory base lives under the OS %TEMP%
# directory, which is outside the sandboxed working directory both agents
# run in. Any test using tmp_path fails there unless basetemp is redirected
# inside the repo, so pin it here instead of relying on callers to remember
# --basetemp by hand.
addopts = --basetemp=workspace/.pytest_tmp
